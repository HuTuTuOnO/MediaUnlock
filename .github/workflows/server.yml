name: server

# 打 tag(v*)自动跑;也可以在 Actions 页面手动 Run workflow。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read # 只读代码,checkout 用
  packages: write # 推 ghcr.io 镜像

jobs:
  # 先比出 server/ 或 web/ 相对上一个 tag 动没动 —— web/dist 是要嵌进 server 二进制的,
  # 所以只改前端也得重编。
  #
  # 不能用 on.push.paths 过滤:GitHub 明确说 paths 过滤对 tag push 不生效,
  # 而本仓库是靠打 tag 发布的,只能自己比。
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要比历史 tag,浅克隆拿不到
      - id: diff
        run: |
          # 手动触发不属于"某个 tag 发布",没有可比的上一个 tag,一律当有改动
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 首个 tag 时 describe 无输出 → 当有改动
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -z "$PREV" ]] || ! git diff --quiet "$PREV" HEAD -- server web; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "server/ 与 web/ 相对 $PREV 都没改动,跳过"
          fi

  build:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端并同步进嵌入目录
        run: |
          cd web && npm ci && npm run build
          cd ../server
          rm -rf internal/static/web
          mkdir -p internal/static/web
          cp -R ../web/dist/. internal/static/web/

      - name: 测试
        working-directory: server
        run: go test ./...

      # Server 只通过 ghcr 镜像分发,不再传 Release,所以这里编一遍只为验证交叉编译能过
      - name: 编译 linux/${{ matrix.arch }}
        working-directory: server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" \
            -o ../dist/server_linux_${{ matrix.arch }} ./cmd/server

  # needs 的 build 被跳过时这个 job 也会被跳过 —— 只改 agent 的 tag 不会推镜像
  docker:
    # build 里的 go test 没过就不该推镜像,所以串在它后面
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io 的镜像名必须全小写,而仓库 owner 可能有大写字母
      - name: 算出镜像名
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mediaunlock-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest 只在打 tag 时生成 —— 手动在分支上跑不会把 latest 覆盖掉
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
