name: server

# 打 tag(v*)自动跑;也可以在 Actions 页面手动 Run workflow。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read # 只读代码,checkout 用
  packages: write # 推 ghcr.io 镜像

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端并同步进嵌入目录
        run: |
          cd web && npm ci && npm run build
          cd ../server
          rm -rf internal/static/web
          mkdir -p internal/static/web
          cp -R ../web/dist/. internal/static/web/

      - name: 测试
        working-directory: server
        run: go test ./...

      # Server 只通过 ghcr 镜像分发,不再传 Release,所以这里编一遍只为验证交叉编译能过
      - name: 编译 linux/${{ matrix.arch }}
        working-directory: server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" \
            -o ../dist/server_linux_${{ matrix.arch }} ./cmd/server

  docker:
    # build 里的 go test 没过就不该推镜像,所以串在它后面
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io 的镜像名必须全小写,而仓库 owner 可能有大写字母
      - name: 算出镜像名
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mediaunlock-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest 只在打 tag 时生成 —— 手动在分支上跑不会把 latest 覆盖掉
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
