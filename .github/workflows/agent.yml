name: agent

# 打 tag(v*)自动跑;也可以在 Actions 页面手动 Run workflow。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时把产物附到 Release

jobs:
  # 先比出 agent/ 相对上一个 tag 动没动 —— 一次 tag 常常只改一个组件
  # (如 v0.1.4 只动了 server),另一个跟着重编纯属浪费。
  #
  # 不能用 on.push.paths 过滤:GitHub 明确说 paths 过滤对 tag push 不生效,
  # 而本仓库是靠打 tag 发布的,只能自己比。
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要比历史 tag,浅克隆拿不到
      - id: diff
        run: |
          # 手动触发不属于"某个 tag 发布",没有可比的上一个 tag,一律当有改动
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 首个 tag 时 describe 无输出 → 当有改动
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -z "$PREV" ]] || ! git diff --quiet "$PREV" HEAD -- agent; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "agent/ 相对 $PREV 没改动,跳过"
          fi

  build:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: 测试
        working-directory: agent
        run: go test ./...

      - name: 编译 linux/${{ matrix.arch }}
        working-directory: agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          V="$GITHUB_REF_NAME"                              # tag 名,或分支名
          [[ "$GITHUB_REF_TYPE" != "tag" ]] && V="${GITHUB_SHA:0:12}"
          go build -trimpath -ldflags="-s -w -X main.version=$V" \
            -o ../dist/agent_linux_${{ matrix.arch }} ./cmd/agent

      # install.sh 从 Release 下的是 agent-v<版本>-linux-<arch>.tar.gz,
      # 包内可执行文件叫 agent(见 install.sh 里的 find -name agent)。
      - name: 打包 tar.gz
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/pkg && cp dist/agent_linux_${{ matrix.arch }} /tmp/pkg/agent
          tar czf "dist/agent-v${V}-linux-${{ matrix.arch }}.tar.gz" -C /tmp/pkg agent

      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # needs 的 build 被跳过时这个 job 也会被跳过 —— 只改 server 的 tag 不会建出空 Release,
  # install.sh 的 releases/latest 因此仍指向上一个真正发过 agent 的版本。
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 这个 job 没有 checkout,工作目录里没有 .git,gh 认不出仓库,得用 GH_REPO 指路
      - name: 附到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 这个 workflow 是 Release 的唯一创建者(server 不再建),所以 create 失败就是真出错了,
          # 不能吞掉 —— 之前用 `|| true` 兜着,结果 Release 停在草稿态没人发现
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          # 只传 tar.gz:裸二进制 install.sh 不用,它的内容就在 tar.gz 里面
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
