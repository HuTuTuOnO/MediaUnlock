# Server 配置示例。复制为 config.yml 后填写。
# 详见 需求文档.md 3. Server。

server:
  addr: ":8080"                  # HTTP 监听地址

database:
  path: ./data/database.db       # SQLite 文件路径(默认)

jwt:
  secret: "change-me"            # JWT 签名密钥(务必修改)
  expire_hours: 72               # Web 登录 token 有效期(小时)

# 初始管理员:账号固定 admin,首次启动若无用户则自动创建,随机密码打印到启动日志。
# 登录后请尽快在"系统设置"里修改密码。
